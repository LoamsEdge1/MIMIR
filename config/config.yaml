# MIMIR configuration — single source of truth.
# No path or model name is ever hardcoded in src/.

data_root: "C:\\MIMIR"

models:
  # Rung 0. Source: C:\MIMIR\logs\benchmark-2026-09-08.json, re-run
  # 2026-09-08 16:08 through llm/local.py after the sharpened classifier
  # prompt and the deterministic chaining pre-check:
  #   qwen2.5:7b  93.0% accuracy, 76.1 tok/s, 1.8% under-escalation  <- chosen
  #   llama3.1:8b 78.9% accuracy, 72.9 tok/s, 12.3% under-escalation
  # Both 100% valid JSON. Qwen won on accuracy AND speed once the prompt was
  # fixed — the first run's result was a prompt problem, not a model problem.
  # The earlier figures here (100.0% / 93.8%) matched no logged run and have
  # been replaced with the measured ones. Run 1 of the same day is kept at
  # benchmark-2026-09-08-run1.json: 91.2% / 78.9%, one case apart.
  local: "qwen2.5:7b-instruct-q4_K_M"

  # NOT a fallback. Benchmark comparison only.
  # llama3.1:8b fabricated targets on 11 of 65 cases (57 + 8 probes),
  # including inventing "MIMIR" and "chrome" for prompts that named neither.
  # A fallback that invents file paths is worse than no fallback, so there
  # isn't one: if the local model fails, escalate. See on_local_failure below.
  benchmark_alt: "llama3.1:8b"
  embed: "nomic-embed-text"
  embed_alt: "bge-m3"               # already local; larger, stronger, costs more VRAM
  # Cloud ladder — all three verified working via claude -p
  rung_1: "claude-haiku-4-5"
  rung_2: "claude-sonnet-5"
  rung_3: "claude-opus-5"

ollama:
  # Local inference host. Nothing in src/ carries this literal.
  host: "http://127.0.0.1:11434"
  # How long Ollama keeps the model in VRAM after a call. Game mode overrides
  # this with keep_alive=0 through llm.local.unload().
  keep_alive: "5m"
  request_timeout_seconds: 180
  load_timeout_seconds: 300      # cold pull into VRAM is slow on first call
  unload_timeout_seconds: 30
  # unload() raises if the model still holds VRAM after this settle window.
  # Ollama drops the runner asynchronously; the driver reports the release a
  # moment later.
  unload_settle_seconds: 8

routing:
  # Self-reported confidence is NOT trusted. Benchmark 2026-09-08 found both
  # local models are as confident when wrong as when right (qwen 0.92 right /
  # 0.94 wrong; llama 0.85 / 0.84). A number that does not correlate with
  # correctness is not a safety mechanism, so the gate is off.
  #
  # Escalation instead relies on signals that cannot be faked:
  #   - deterministic chaining pre-check (router/chaining.py)
  #   - hard_task_classes below
  #   - stage 3 target resolution failure  <- the real uncertainty signal
  #   - stage 6 verification failure
  confidence_gate_enabled: false
  confidence_threshold: 0.75          # retained for logging only
  escalate_on_unresolved_target: true
  on_local_failure: escalate_rung_1   # never fall back to another local model
  hard_task_classes: [code, analysis, vision, multistep, financial]
  daily_escalation_warn: 25
  cloud_timeout_seconds: 120

control:
  tier_order: [scripted, uia, vision]
  uia_enabled: false      # Phase 3
  vision_enabled: false   # Phase 3

game_mode:
  poll_seconds: 5
  gpu_memory_threshold_mb: 1500
  debounce_polls: 2
  always_games: []
  never_games: []

persona:
  address: "brother"
  address_frequency: sparing
  max_character_sentences: 1
  disabled_for: [deliverable, code, analysis, document]

modes:
  default: silent

daemon:
  host: "127.0.0.1"
  port: 8756

orb_states:
  idle:       { emergence: 0.5, scale: 13, speed: 1.5, detail: 3.0, bloom: 0.5 }
  listening:  { emergence: 0.3, scale: 22, speed: 2.7, detail: 4.4, bloom: 0.4 }
  processing: { emergence: 0.8, scale: 16, speed: 4.0, detail: 6.0, bloom: 0.8 }
  speaking:   { emergence: 0.6, scale: 17, speed: 3.0, detail: 5.0, bloom: 0.6 }
  error:      { emergence: 0.9, scale: 18, speed: 0.5, detail: 2.0, bloom: 0.6 }
  offline:    { emergence: 0.3, scale: 22, speed: 2.7, detail: 4.4, bloom: 0.4 }
